<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Inherited 401(k) Withdrawal Calculator{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f0f2f5; }
    .site-header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 1rem 0;
      margin-bottom: 2rem;
    }
    .site-header .brand {
      color: #fff;
      font-size: 1.25rem;
      font-weight: 600;
      text-decoration: none;
    }
    .site-header .brand span { color: #7eb8f7; }
    .card {
      border: none;
      border-radius: 0.75rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .recommendation-card { border-left: 4px solid transparent; }
    .rec-min-tax  { border-left-color: #198754; }
    .rec-max-save { border-left-color: #0d6efd; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="brand">Inherited <span>401(k)</span> Withdrawal Calculator</a>
    </div>
  </header>
  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
